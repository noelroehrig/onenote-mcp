[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onenote-mcp"
version = "1.1.0"
description = "Local MCP server for reading and editing OneNote desktop pages on Windows via the COM API — no Graph, no cloud auth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "comtypes",
    "pywin32",
]

[project.scripts]
onenote-mcp = "onenote_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring OneNote desktop (use -m e2e to run)",
]
